name = "aesthetic-back"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "3605feddabf446a2aaa038d3f7f3c511"

[vars]
# Las secrets se agregan con: wrangler secret put DATABASE_URL
